# SonarQube — TypeScript/React frontend (frontend/).
# Запуск: .\orchestrator\tools\sonar_scan.ps1 -Target frontend
# Нужен SONAR_TOKEN (UI Sonar → My Account → Security → Generate Tokens).

sonar.projectKey=prettyk-frontend
sonar.projectName=prettyk frontend
sonar.projectVersion=1.0

sonar.sources=frontend/src
sonar.tests=frontend/src
# Только TypeScript/TSX/JS — иначе Python sensor цепляет orchestrator из корня mount.
sonar.inclusions=**/*.ts,**/*.tsx,**/*.js,**/*.jsx
sonar.test.inclusions=frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx

# MC-1: бинарники / node_modules / generated вне анализа.
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/__pycache__/**,\
  **/.venv/**,\
  **/generated/**,\
  **/e2e/**,\
  **/scripts/**,\
  **/public/**,\
  **/coverage/**,\
  **/playwright-report/**,\
  **/*.png,\
  **/*.svg,\
  **/*.jpg,\
  **/*.jpeg,\
  **/*.gif,\
  **/*.ico,\
  **/*.webp,\
  **/*.mp4,\
  **/*.webm,\
  **/*.woff,\
  **/*.woff2,\
  **/*.ttf,\
  **/*.eot,\
  **/*.wasm,\
  **/*.bin,\
  **/*.json,\
  **/*.css

sonar.sourceEncoding=UTF-8

# SQ-FE-HEAP: Node.js OOM on Monaco/AntD/ReactFlow (989 files).
# Without this the sensor crashes with "heap size limit 2240 MB".
# Set to 4096 because Docker --memory=4g gives Node.js ~2.2GB by default.
sonar.javascript.node.maxspace=4096

# MC-2: coverage LCOV path (prep: sonar_coverage_prep.py). Zero или live.
# Test execution report stub.
sonar.typescript.lcov.reportPaths=frontend/coverage/lcov.info

# SQ-FE-SUPPRESS: suppress noise in test files (not production code).
sonar.issue.ignore.multicriteria=fe1
sonar.issue.ignore.multicriteria.fe1.ruleKey=typescript:S1128
sonar.issue.ignore.multicriteria.fe1.resourceKey=**/*.test.ts,**/*.test.tsx