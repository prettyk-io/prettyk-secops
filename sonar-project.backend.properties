# SonarQube — только Python backend (orchestrator).
# Запуск: .\orchestrator\tools\sonar_scan.ps1 -Target backend
# Нужен SONAR_TOKEN (UI Sonar → My Account → Security → Generate Tokens).

sonar.projectKey=prettyk-backend
sonar.projectName=prettyk backend
sonar.projectVersion=1.0

sonar.sources=orchestrator
sonar.tests=orchestrator/tests
# Только Python — иначе JS sensor цепляет frontend/tsconfig из корня mount.
sonar.inclusions=**/*.py
sonar.test.inclusions=orchestrator/tests/**/test_*.py,orchestrator/tests/**/*_test.py

# MC-1: бинарники / медиа вне анализа (noise + scanner hang).
sonar.exclusions=\
  **/__pycache__/**,\
  **/.venv/**,\
  **/deploy_vps/**,\
  **/llm-model/**,\
  **/*.gguf,\
  **/data/fuzz/**,\
  **/tools/lab_*.py,\
  **/frontend/**,\
  **/node_modules/**,\
  **/*.png,\
  **/*.svg,\
  **/*.jpg,\
  **/*.jpeg,\
  **/*.gif,\
  **/*.ico,\
  **/*.webp,\
  **/*.mp4,\
  **/*.webm,\
  **/*.woff,\
  **/*.woff2,\
  **/*.ttf,\
  **/*.eot,\
  **/*.wasm,\
  **/*.bin,\
  **/*.exe,\
  **/*.dll,\
  **/*.so,\
  **/*.dylib,\
  **/*.zip,\
  **/*.7z,\
  **/*.pdf

sonar.sourceEncoding=UTF-8
sonar.python.version=3.11

# MC-2: coverage path (prep: sonar_coverage_prep.py). Zero или live Cobertura.
# XUnit stub — иначе сенсор обходит monorepo.
sonar.python.coverage.reportPaths=reports/coverage-backend.xml
sonar.python.xunit.reportPath=reports/sonar-no-xunit.xml

# SQ-BE-SUPPRESS: MethodId wire идиомы — rename ломает facade (см. docs/backlog.md).
sonar.issue.ignore.multicriteria=be1,be2
sonar.issue.ignore.multicriteria.be1.ruleKey=python:S1845
sonar.issue.ignore.multicriteria.be1.resourceKey=**/webdriver_adapter.py
sonar.issue.ignore.multicriteria.be2.ruleKey=python:S3516
sonar.issue.ignore.multicriteria.be2.resourceKey=**/webdriver_adapter.py
