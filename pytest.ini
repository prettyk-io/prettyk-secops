# QA-1: fast vs heavy. UI/debug loops → not heavy.
#   py -3 -m pytest -m "not heavy" -q
# Lab/opt-in (scanner, Live stack, env gates) → mark heavy/lab.
[pytest]
testpaths = orchestrator/tests
pythonpath = orchestrator
markers =
    heavy: lab / opt-in env / long wall-time — exclude from UI-iteration loops
    lab: requires local lab stack (Live / scanner / Allure / Dojo as noted in test)
