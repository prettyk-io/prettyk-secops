<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pretty< LIVE</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='2' y='9' width='60' height='46' rx='8' fill='%2312141a' stroke='%238ab4f8' stroke-width='5'/%3E%3Cpath fill='%238ab4f8' d='M24.5 19.5v25c0 1.3 1.4 2.1 2.5 1.4l18.5-12.5c1-.7 1-2.1 0-2.8l-18.5-12.5c-1.1-.7-2.5.1-2.5 1.4z'/%3E%3C/svg%3E" />
  <link rel="alternate icon" type="image/svg+xml" href="/secops-monitor-icon.svg" />
  <link rel="apple-touch-icon" href="/secops-monitor-icon.png" />
  <style>
    :root {
      --bg: #12141a;
      --panel: #1a1d26;
      --border: #2a2f3a;
      --text: #e8eaed;
      --muted: #9aa0a6;
      --step: #8ab4f8;
      --note: #bdc1c6;
      --error: #f28b82;
      --high: #fdd663;
      --medium: #fbbc04;
      --input: #0e1016;
      --header-h: 41px;
      --playhead-h: 30px;
      /* WebDriver viewport 1920×1080 → 16:9 */
      --video-ar: 16 / 9;
      --video-w: 960px;
      --video-h: 540px;
      --inspector-w: 403px;
      --zap-min: 220px;
      --diary-min: 140px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font: 13px/1.4 "Segoe UI", system-ui, sans-serif;
    }
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      height: var(--header-h);
      padding: 0 12px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      flex-shrink: 0;
    }
    header h1 {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      flex: 0 1 auto;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #e8eaed;
    }
    .live-deep-links {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
      flex-shrink: 0;
    }
    .live-deep-links a {
      color: var(--step);
      text-decoration: none;
      font-size: 12px;
      padding: 3px 8px;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: var(--input);
    }
    .live-deep-links a:hover {
      border-color: rgba(138, 180, 248, 0.55);
      background: rgba(138, 180, 248, 0.1);
    }
    /* MH-6: дропдаун «Все запуски» */
    .runs-dropdown {
      display: inline-flex;
      align-items: center;
      flex-shrink: 0;
      color: var(--step);
      font-size: 12px;
      padding: 3px 8px;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: var(--input);
      cursor: pointer;
      max-width: 180px;
      outline: none;
    }
    .runs-dropdown:focus {
      border-color: rgba(138, 180, 248, 0.55);
    }
    .runs-dropdown option {
      color: var(--text);
      background: #1a1f2e;
    }
    .live-view-switcher {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin-left: 0;
      padding: 3px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--input);
      flex-shrink: 0;
    }
    .filter-presets {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }
    .filter-presets button {
      background: transparent;
      border: 1px solid transparent;
      color: var(--muted);
      border-radius: 4px;
      padding: 2px 7px;
      font: 11px/1.2 "Segoe UI", system-ui, sans-serif;
      cursor: pointer;
    }
    .filter-presets button:hover {
      color: var(--text);
      border-color: #4a5568;
    }
    .filter-presets button.active {
      color: var(--step);
      border-color: rgba(138, 180, 248, 0.45);
      background: rgba(138, 180, 248, 0.1);
    }
    .live-view-button {
      display: inline-grid;
      width: 28px;
      height: 26px;
      place-items: center;
      padding: 0;
      border: 1px solid transparent;
      border-radius: 4px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }
    .live-view-button:hover {
      color: var(--text);
      border-color: #4a5568;
    }
    .live-view-button.active {
      color: var(--step);
      border-color: rgba(138, 180, 248, 0.5);
      background: rgba(138, 180, 248, 0.12);
    }
    .live-view-button svg {
      width: 18px;
      height: 18px;
    }
    .live-view-button:disabled {
      opacity: 0.35;
      cursor: default;
      pointer-events: none;
    }
    .live-view-divider {
      color: #4a5568;
      font: 14px/1 ui-monospace, "Cascadia Mono", Consolas, monospace;
      user-select: none;
    }
    .kdt-prettyk-live {
      display: block;
      height: 28px;
      width: auto;
      user-select: none;
    }
    header a { color: var(--step); }
    .instance-tags {
      display: inline-flex;
      align-items: baseline;
      gap: 6px;
      flex-shrink: 0;
    }
    .instance-tag {
      background: none;
      border: 0;
      border-radius: 0;
      padding: 0;
      font: 13px/1.4 "Segoe UI", system-ui, sans-serif;
      color: var(--muted);
      white-space: nowrap;
      user-select: all;
      cursor: default;
      vertical-align: baseline;
    }
    .instance-tag:not(:last-child)::after {
      content: "·";
      margin-left: 6px;
      color: #4a5568;
    }
    .results-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-weight: 600;
    }
    .results-link-icon {
      font-size: 13px;
      line-height: 1;
      transition: transform 140ms ease;
    }
    .results-link:hover .results-link-icon {
      transform: translateX(2px);
    }
    /* Пульсация для кнопки результатов, когда статус running */
    .results-link.pulse {
      animation: results-glow 2s ease-in-out infinite;
    }
    @keyframes results-glow {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.55; }
    }
    .status-flag {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--muted);
      flex-shrink: 0;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .debug-controls {
      display: none;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .debug-controls.visible { display: flex; }
    .debug-banner {
      font-size: 11px;
      color: #fdd663;
      max-width: 220px;
      line-height: 1.25;
    }
    .debug-controls button {
      background: var(--input);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 4px;
      padding: 4px 10px;
      font: 12px/1.2 "Segoe UI", system-ui, sans-serif;
      cursor: pointer;
    }
    .debug-controls button:hover { border-color: #5a7ab5; color: var(--step); }
    .debug-controls button:disabled {
      opacity: 0.45;
      cursor: default;
    }
    .status-flag.online .status-dot {
      background: #34a853;
    }
    .status-flag.pulse .status-dot {
      background: #34a853;
      animation: status-pulse 2s ease-in-out infinite;
    }
    .status-flag.offline .status-dot {
      background: #ea4335;
    }
    @keyframes status-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.45; }
    }
    .layout {
      height: calc(100vh - var(--header-h) - var(--playhead-h));
      min-height: 0;
      overflow: hidden;
    }
    .playhead {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      height: var(--playhead-h);
      padding: 0 12px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .playhead-controls {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-right: 10px;
      flex-shrink: 0;
    }
    .playhead-btn {
      display: inline-grid;
      width: 26px;
      height: 24px;
      place-items: center;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--input);
      color: var(--muted);
      cursor: pointer;
      flex-shrink: 0;
    }
    .playhead-btn:hover {
      color: var(--text);
      border-color: rgba(138, 180, 248, 0.55);
      background: rgba(138, 180, 248, 0.1);
    }
    .playhead-btn:disabled {
      opacity: 0.45;
      cursor: default;
    }
    .playhead-btn svg {
      width: 14px;
      height: 14px;
    }
    .playhead-track {
      position: relative;
      height: 100%;
      display: flex;
      align-items: center;
    }
    .playhead-bar {
      position: relative;
      width: 100%;
      height: 3px;
      background: #2a2f3a;
      border-radius: 2px;
      cursor: pointer;
      transition: height 140ms ease;
      touch-action: none; /* pointer capture — скраббинг не срывается тач-скроллом */
    }
    .playhead:hover .playhead-bar {
      height: 6px;
    }
    .playhead-fill {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      background: #8ab4f8;
      border-radius: 2px;
      pointer-events: none;
    }
    .playhead-thumb {
      position: absolute;
      top: 50%;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #8ab4f8;
      transform: translate(-50%, -50%);
      pointer-events: none;
      opacity: 0;
      transition: opacity 100ms ease;
    }
    .playhead:hover .playhead-thumb,
    .playhead.dragging .playhead-thumb {
      opacity: 1;
    }
    .playhead-marker {
      position: absolute;
      top: 50%;
      width: 3px;
      height: 10px;
      border-radius: 1px;
      transform: translate(-50%, -50%);
      cursor: pointer;
      transition: height 80ms ease;
    }
    .playhead:hover .playhead-marker {
      height: 16px;
    }
    .playhead-marker[data-kind="STEP"] { background: #8ab4f8; }
    .playhead-marker[data-kind="ERROR"] { background: #f28b82; }
    .playhead-marker[data-kind="HIGH"] { background: #fdd663; }
    .playhead-marker[data-kind="ZAP"] { background: #ff8a65; }
    .playhead-time {
      display: flex;
      align-items: center;
      gap: 3px;
      margin-left: 10px;
      font: 11px/1 ui-monospace, "Cascadia Mono", Consolas, monospace;
      color: var(--muted);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .playhead-time .current {
      color: var(--step);
      min-width: 5ch;
      text-align: right;
    }
    .playhead-time .sep { color: #4a5568; }
    .playhead-time .total { min-width: 5ch; }
    .stage {
      display: grid;
      position: relative;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      grid-template-columns: var(--video-w) minmax(var(--zap-min), 1fr);
      grid-template-rows: var(--video-h) minmax(var(--diary-min), 1fr);
      overflow: hidden;
    }
    .vnc-cell {
      grid-column: 1;
      grid-row: 1;
      position: relative;
      min-width: 0;
      min-height: 0;
      background: #000;
      overflow: hidden;
    }
    .vnc-cell.headless {
      display: none;
    }
    .vnc {
      position: absolute;
      inset: 0;
      background: #000;
    }
    .vnc iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
    }
    .replay-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
      display: none;
    }
    .replay-video.show { display: block; }
    .diary-pane {
      grid-column: 1;
      grid-row: 2;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--panel);
      border-top: 1px solid var(--border);
    }
    .zap-pane {
      grid-column: 2;
      grid-row: 1 / -1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background: var(--panel);
      border-left: 1px solid var(--border);
    }
    /* В наблюдателе дневник и ZAP остаются исходными grid-панелями. */
    .focus-inspector { display: contents; }
    .focus-log-pane { display: none; }
    .execution-rail {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      min-height: 0;
      padding: 7px 10px;
      overflow: hidden;
    }
    .execution-rail-direction {
      color: #526174;
      font: 18px/1 ui-monospace, "Cascadia Mono", Consolas, monospace;
      user-select: none;
    }
    .execution-rail-slots {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      align-items: stretch;
      height: 100%;
      min-width: 0;
      margin: 0 7px;
      padding: 0;
      list-style: none;
    }
    .execution-rail-slot {
      position: relative;
      display: flex;
      min-width: 0;
      flex-direction: column;
      justify-content: center;
      margin: 2px 0;
      padding: 2px 10px;
      color: var(--muted);
      border: 1px solid transparent;
      border-radius: 3px;
      transition: box-shadow 160ms ease, border-color 160ms ease, background 160ms ease;
    }
    .execution-rail-slot:nth-child(1),
    .execution-rail-slot:nth-child(2) {
      border-right: 1px solid rgba(138, 180, 248, 0.58);
    }
    .execution-rail-slot[data-rail-state="next"] {
      opacity: 0.51;
    }
    /* Текущий шаг под оболочкой: тонкий border, тень вниз-вправо */
    .execution-rail-slot[data-rail-state="current"] {
      z-index: 2;
      margin: 0;
      color: var(--text);
      border-color: rgba(138, 180, 248, 0.55);
      border-radius: 3px;
      background: linear-gradient(
        180deg,
        rgba(138, 180, 248, 0.14) 0%,
        rgba(138, 180, 248, 0.05) 100%
      );
      box-shadow:
        inset 0 0 0 1px rgba(138, 180, 248, 0.28),
        3px 3px 10px rgba(138, 180, 248, 0.35),
        6px 6px 18px rgba(138, 180, 248, 0.18);
    }
    .execution-rail-slot[data-rail-state="past-1"] { opacity: 0.54; }
    .execution-rail-slot[data-rail-state="past-2"] { opacity: 0.45; }
    .execution-rail-slot[data-rail-state="past-3"] { opacity: 0.36; }
    .execution-rail-method,
    .execution-rail-constructor {
      display: block;
      overflow: hidden;
      color: var(--step);
      font-weight: 600;
      letter-spacing: 0.01em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .execution-rail-method { font-size: 13px; }
    .execution-rail-constructor {
      display: none;
    }
    @media (max-width: 760px) {
      .stage[data-live-view="focus"] {
        display: block;
      }
      .stage[data-live-view="focus"] .vnc-cell {
        position: absolute;
        inset: 0;
      }
      .stage[data-live-view="focus"] .focus-inspector {
        position: absolute;
        right: 10px;
        bottom: 10px;
        z-index: 2;
        width: calc(100% - 20px);
        height: min(42vh, 330px);
        border: 1px solid #3b4556;
        border-radius: 8px;
        box-shadow: 0 14px 34px rgba(0, 0, 0, 0.48);
      }
      .stage[data-live-view="focus"] .execution-rail {
        display: none;
      }
    }
    /* Рабочая сцена: исходная компоновка с журналом справа и футером слева. */
    .stage[data-live-view="focus"] {
      grid-template-columns: 1fr var(--inspector-w);
      grid-template-rows: 1fr auto;
      align-content: stretch;
      justify-content: stretch;
    }
    .stage[data-live-view="focus"] .vnc-cell {
      position: relative;
      grid-column: 1;
      grid-row: 1;
      display: block;
      width: 100%;
      height: 100%;
    }
    .stage[data-live-view="focus"] .vnc {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .stage[data-live-view="focus"] .vnc iframe {
      width: 100%;
      height: 100%;
    }
    .stage[data-live-view="focus"] .focus-inspector {
      position: relative;
      right: auto;
      bottom: auto;
      z-index: auto;
      display: flex;
      grid-column: 2;
      grid-row: 1 / -1;
      width: auto;
      height: auto;
      flex-direction: column;
      overflow: hidden;
      border: 0;
      border-left: 1px solid var(--border);
      border-radius: 0;
      background: var(--panel);
      box-shadow: none;
    }
    .stage[data-live-view="focus"] .focus-log-pane {
      display: flex;
      min-height: 0;
      flex: 1 1 auto;
      flex-direction: column;
      overflow: hidden;
      border: 0;
      background: var(--panel);
    }
    .stage[data-live-view="focus"] .diary-pane,
    .stage[data-live-view="focus"] .zap-pane {
      display: none;
    }
    .stage[data-live-view="observer"] .focus-log-pane {
      display: none;
    }
    .stage[data-live-view="focus"] .execution-rail {
      grid-column: 1;
      grid-row: 2;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      min-height: 0;
      padding: 6px 10px;
      /* visible: иначе outer glow у current срезается оболочкой */
      overflow: visible;
      border-top: 1px solid var(--border);
      background: #000;
    }
    .stage[data-live-view="focus"] .execution-rail-slots {
      overflow: hidden;
    }
    .stage[data-live-view="observer"] .execution-rail {
      display: none;
    }
    /* MON-9: split 50/50 — слева видео (VNC/запись), справа консоль логов
       (merged focus-log-pane) + каретка шагов (execution-rail) под ней.
       Ползунок таймлайна уже во всю ширину под хедером (отдельный .playhead). */
    .stage[data-live-view="split"] {
      grid-template-columns: 1fr 1fr;
      grid-template-rows: minmax(0, 1fr) auto;
      align-content: stretch;
      justify-content: stretch;
    }
    .stage[data-live-view="split"] .vnc-cell {
      display: block;
      grid-column: 1;
      grid-row: 1 / -1;
      position: relative;
      min-width: 0;
      min-height: 0;
      width: 100%;
      height: 100%;
    }
    .stage[data-live-view="split"] .focus-inspector {
      display: contents;
    }
    .stage[data-live-view="split"] .focus-log-pane {
      display: flex;
      grid-column: 2;
      grid-row: 1;
      min-width: 0;
      min-height: 0;
      flex-direction: column;
      overflow: hidden;
      border-left: 1px solid var(--border);
      background: var(--panel);
    }
    .stage[data-live-view="split"] .diary-pane,
    .stage[data-live-view="split"] .zap-pane {
      display: none;
    }
    .stage[data-live-view="split"] .execution-rail {
      display: grid;
      grid-column: 2;
      grid-row: 2;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      min-height: 0;
      padding: 6px 10px;
      overflow: visible;
      border-top: 1px solid var(--border);
      background: #000;
    }
    .pane-toolbar {
      display: flex;
      align-items: center;
      gap: 4px;
      min-height: 37px;
      padding: 4px 6px 4px 10px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .kind-chips {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }
    .kind-chips button {
      background: var(--input);
      border: 1px solid transparent;
      color: var(--muted);
      border-radius: 4px;
      padding: 4px 7px;
      font: 11px/1.2 "Segoe UI", system-ui, sans-serif;
      cursor: pointer;
    }
    .kind-chips button:hover { border-color: #4a5568; color: var(--text); }
    .kind-chips button.active {
      color: var(--step);
      border-color: rgba(138, 180, 248, 0.5);
      background: rgba(138, 180, 248, 0.12);
    }
    .filter-input {
      margin-left: auto;
      box-sizing: border-box;
      flex: 0 0 158px;
      width: 158px;
      min-width: 158px;
      max-width: 158px;
      background: var(--input);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 4px;
      padding: 6px 10px;
      font: 13px/1.3 ui-monospace, "Cascadia Mono", Consolas, monospace;
      outline: none;
      transition:
        width 0.18s ease,
        flex-basis 0.18s ease,
        min-width 0.18s ease,
        max-width 0.18s ease,
        border-color 0.18s ease;
    }
    .filter-input:focus,
    .filter-input.is-expanded {
      border-color: #5a7ab5;
      flex: 0 0 221px;
      width: 221px;
      min-width: 221px;
      max-width: 221px;
    }
    .filter-input.bad { border-color: var(--error); }
    .log {
      flex: 1 1 0;
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 10px 12px 16px;
      font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
      font-size: 14px;
      line-height: 1.55;
      scrollbar-width: thin;
      scrollbar-color: rgba(0, 0, 0, 0.5) transparent;
    }
    .log::-webkit-scrollbar { width: 4px; height: 4px; }
    .log::-webkit-scrollbar-button { display: none; width: 0; height: 0; }
    .log::-webkit-scrollbar-track { background: transparent; }
    .log::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.5);
      border-radius: 2px;
    }
    .log::-webkit-scrollbar-thumb:active {
      background: rgba(0, 0, 0, 0.2);
    }
    .row {
      padding: 5px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      word-break: break-word;
    }
    .row.hidden { display: none; }
    .row .kind { display: inline-block; min-width: 1.9em; margin-right: 0.35em; font-weight: 650; }
    .row.STEP .kind { color: var(--step); }
    .row.NOTE .kind { color: var(--note); }
    .row.ERROR .kind { color: var(--error); }
    .row.HIGH .kind { color: var(--high); }
    .row.MEDIUM .kind { color: var(--medium); }
    .row.LOW .kind { color: #81c995; }
    .row.INFO .kind, .row.INFORMATIONAL .kind { color: #80cbc4; }
    .row.LOG .kind, .row.CONSOLE .kind { color: #c3a6ff; }
    /* ZAP + ФАЗЗИНГ / FUZZ — один «оранжевый» DAST-тон. */
    .row.ZAP .kind,
    .row.FUZZ .kind,
    .row.ФАЗЗИНГ .kind { color: #ff8a65; }
    .row .ts { color: var(--muted); margin-right: 8px; }
    .empty { color: var(--muted); padding: 12px 0; }
    mark {
      background: rgba(253, 214, 99, 0.35);
      color: inherit;
      border-radius: 2px;
      padding: 0 1px;
    }

    /* ── MH-3: HomePage (dynamic apps table) ── */
    .homepage { display: none; flex-direction: column; flex: 1; min-height: 0; overflow: auto; }
    .homepage.active { display: flex; }
    .hp-panel {
      max-width: 960px;
      margin: 0 auto;
      width: 100%;
      padding: 24px 16px;
    }
    .hp-title {
      font-size: 18px;
      font-weight: 600;
      margin: 0 0 20px 0;
      color: var(--text);
    }
    .hp-table { width: 100%; border-collapse: collapse; }
    .hp-app-row { border-bottom: 1px solid var(--border); cursor: pointer; }
    .hp-app-row:hover { background: rgba(138, 180, 248, 0.04); }
    .hp-app-row td { padding: 10px 8px; vertical-align: top; }
    .hp-app-code {
      font-weight: 600;
      font-size: 13px;
      color: var(--step);
      text-decoration: none;
    }
    .hp-app-code:hover { text-decoration: underline; }
    .hp-app-meta {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }
    .hp-app-count {
      font-size: 12px;
      color: var(--muted);
      text-align: right;
      white-space: nowrap;
    }
    .hp-app-arrow {
      font-size: 12px;
      color: var(--muted);
      text-align: center;
      width: 20px;
      transition: transform 0.2s;
    }
    .hp-app-row.open .hp-app-arrow { transform: rotate(90deg); }
    .hp-deploy-row { display: none; }
    .hp-app-row.open + .hp-deploy-row { display: table-row; }
    .hp-deploy-row td {
      padding: 0 0 12px 32px;
    }
    .hp-deploy-block {
      border-left: 1px solid var(--border);
      padding: 8px 0 8px 14px;
      margin: 0;
    }
    .hp-deploy-url {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
      word-break: break-all;
    }
    .hp-deploy-instance {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 8px;
      border-radius: 5px;
      background: var(--input);
      border: 1px solid var(--border);
      margin-bottom: 4px;
      font-size: 12px;
    }
    .hp-deploy-instance:hover { border-color: rgba(138, 180, 248, 0.4); }
    .hp-instance-id {
      color: var(--step);
      text-decoration: none;
      font-weight: 600;
      flex: 1;
    }
    .hp-instance-id:hover { text-decoration: underline; }
    .hp-instance-status {
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 3px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .hp-instance-status.running { background: rgba(138, 180, 248, 0.2); color: var(--step); }
    .hp-instance-status.success { background: rgba(129, 201, 149, 0.15); color: #81c995; }
    .hp-instance-status.failed { background: rgba(242, 139, 130, 0.15); color: var(--error); }
    .hp-instance-status.unknown { background: rgba(189, 193, 198, 0.12); color: var(--muted); }
    .hp-instance-ts { color: var(--muted); font-size: 11px; white-space: nowrap; }
    .hp-empty {
      text-align: center;
      color: var(--muted);
      padding: 48px 16px;
      font-size: 14px;
    }
    .hp-pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      margin-top: 20px;
    }
    .hp-page-btn {
      padding: 4px 10px;
      border-radius: 5px;
      border: 1px solid var(--border);
      background: var(--input);
      color: var(--step);
      cursor: pointer;
      font-size: 12px;
    }
    .hp-page-btn:disabled { opacity: 0.35; cursor: default; }
    .hp-page-btn:hover:not(:disabled) { border-color: rgba(138, 180, 248, 0.55); background: rgba(138, 180, 248, 0.1); }
    .hp-page-info { font-size: 11px; color: var(--muted); margin: 0 8px; }
    /* Скрытие live-контента когда HomePage активен */
    body.homepage-view header > :not(h1) { display: none; }
    body.homepage-view .playhead,
    body.homepage-view .layout { display: none; }
    body.homepage-view header h1 { flex: 1; }
  </style>
</head>
<body>
  <header>
    <h1><img class="kdt-prettyk-live" src="prettyk-real-live.png" alt="Pretty< LIVE" /><span class="sr-only" style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;">SecOps Lab Monitoring</span></h1>
    <span class="instance-tags" id="instanceTags" hidden>

    <select id="runsDropdown" class="runs-dropdown" hidden aria-label="Все запуски">
    </select>
    <div class="live-view-switcher" role="group" aria-label="Режим отображения Live">
      <button class="live-view-button active" type="button" data-live-view-button="focus"
              aria-label="Рабочая сцена" aria-pressed="true" title="Рабочая сцена">
        <!-- Экран 2:1 без подставки: широкая сцена | узкий лог -->

      </button>
      <span class="live-view-divider" aria-hidden="true">|</span>

              aria-label="Наблюдатель" aria-pressed="false" title="Наблюдатель">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="3" y="4" width="18" height="13" rx="2" stroke="currentColor" stroke-width="1.7"/>
          <path d="M12 5v11M4 11h8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>

      <button class="live-view-button" type="button" data-live-view-button="split"
              aria-label="Сплит 50/50" aria-pressed="false" title="Сплит 50/50">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="1" y="5" width="10" height="14" rx="1.5" stroke="currentColor" stroke-width="1.7"/>
          <rect x="13" y="5" width="10" height="14" rx="1.5" stroke="currentColor" stroke-width="1.7"/>
        </svg>

  </header>
  <div class="playhead" id="playhead">
    <div class="playhead-controls" id="playheadControls">
      <button type="button" class="playhead-btn" id="playheadPlayBtn" aria-label="Воспроизвести" title="Воспроизвести">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
      </button>
      <button type="button" class="playhead-btn" id="playheadPauseBtn" aria-label="Пауза" title="Пауза" hidden>
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"/></svg>
      </button>
      <button type="button" class="playhead-btn" id="playheadStopBtn" aria-label="Стоп" title="Стоп">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1" fill="currentColor"/></svg>
      </button>
    </div>
    <div class="playhead-track" id="playheadTrack">
      <div class="playhead-bar" id="playheadBar">
        <div class="playhead-fill" id="playheadFill" style="width:0%"></div>
        <div class="playhead-thumb" id="playheadThumb" style="left:0%"></div>
        <div class="playhead-markers" id="playheadMarkers"></div>
      </div>
    </div>
    <div class="playhead-time">
      <span class="current" id="playheadCurrent">0:00</span>
      <span class="sep">/</span>
      <span class="total" id="playheadTotal">0:00</span>
    </div>
  </div>
  <div class="layout" id="layout">
    <div class="stage" id="stage" data-live-view="focus">
      <div class="vnc-cell">
        <div class="vnc">
          <iframe
            id="vnc"
            title="noVNC"
            allow="clipboard-read; clipboard-write"
            src="http://127.0.0.1:7900/?autoconnect=1&amp;resize=scale"

        </div>
        <video
          id="replayVideo"
          class="replay-video"
          preload="auto"
          controls
        ></video>
      </div>
      <div class="focus-inspector" id="focusInspector">
        <aside class="focus-log-pane" id="focusLogPane">
          <div class="pane-toolbar">
            <div class="kind-chips" id="focusKindChips">
              <button type="button" data-kind="ALL" class="active">ВСЕ</button>
              <button type="button" data-kind="ZAP">ZAP</button>
              <button type="button" data-kind="STEP">STEP</button>
              <button type="button" data-kind="LOG">LOG</button>
              <button type="button" data-kind="ERROR">ERROR</button>

            <input id="focusFilter" class="filter-input" type="search" spellcheck="false" autocomplete="off"
                   placeholder="Фильтр / regExp" />

        </aside>
        <aside class="diary-pane" id="diaryPane">
          <div class="pane-toolbar">
            <div class="kind-chips" id="diaryKindChips">
              <button type="button" data-kind="ALL" class="active">ВСЕ</button>
              <button type="button" data-kind="STEP">STEP</button>
              <button type="button" data-kind="LOG">LOG</button>
              <button type="button" data-kind="ERROR">ERROR</button>
            </div>
            <input id="diaryFilter" class="filter-input" type="search" spellcheck="false" autocomplete="off"
                   placeholder="Фильтр / regExp" />
