# ZAP AF plan — profile=smoke scan_policy=custom_policy
# Generated by PrettyK gen_af_plan / generate_automation_plan (no autorun).
env:
  contexts:
    - name: juice_ctx
      urls:
        - "http://juice-shop:3000"
      includePaths:
        - "http://juice-shop:3000.*"
      excludePaths: []
  parameters:
    failOnError: true
    failOnWarning: false
    progressToStdout: true
  vars: {}
jobs:
  - type: passiveScan-config
    parameters:
      maxAlertsPerRule: 10
      scanOnlyInScope: true
  - type: spider
    parameters:
      context: juice_ctx
      url: "http://juice-shop:3000"
      maxDuration: 2
      maxDepth: 5
      logoutAvoidance: true
  - type: spiderAjax
    parameters:
      context: juice_ctx
      url: "http://juice-shop:3000"
      maxDuration: 2
      inScopeOnly: true
      logoutAvoidance: true
  - type: passiveScan-wait
    parameters:
      maxDuration: 2
  - type: activeScan-policy
    parameters:
      name: kdt-smoke
    policyDefinition:
      defaultStrength: Low
      defaultThreshold: Medium
  - type: activeScan
    parameters:
      context: juice_ctx
      maxRuleDurationInMins: 1
      maxScanDurationInMins: 3
      policy: kdt-smoke
  - type: report
    parameters:
      template: traditional-html
      reportDir: reports/scanner-results
      reportFile: juice-from-wired
      reportDescription: PrettyK AF smoke
