name: ci

on:
  push:
    branches: [alpha-stable, dev, services, main, master]
  pull_request:

jobs:
  orchestrator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Pytest
        run: python -m pytest tests -q
      - name: validate-only OK
        run: python main.py --wired fixtures/validate_ok.json --validate-only
      - name: validate-only bad ctor (expect fail)
        run: |
          if python main.py --wired fixtures/validate_bad_ctor.json --validate-only; then
            echo "expected exit 1" >&2
            exit 1
          fi

  generators:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r orchestrator/requirements.txt -r orchestrator/requirements-dev.txt
      - name: keywords --check
        run: python orchestrator/tools/export_keywords.py --check
      - name: method_ids --check
        run: python orchestrator/tools/export_method_ids.py --check

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: compose config
        run: |
          docker compose -f services/docker-compose.yml config >/dev/null
          docker compose -f services/docker-compose.scanner.yml config >/dev/null
          docker compose -f services/docker-compose.target.yml config >/dev/null
          docker compose -f services/docker-compose.defectdojo.yml config >/dev/null

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
