# Демо DefectDojo для локального показа (готовые образы Docker Hub).
# НЕ для банка «как есть». Роутинг scanner-отчётов сюда — отдельно, вместе.
#
# Порт UI: 8081 (8080 занят scanner).
# Сеть: pk-net (как остальные сервисы PK).
#
#   docker network create pk-net 2>nul
#   docker compose -f services/docker-compose.defectdojo.yml up -d
#   docker compose -f services/docker-compose.defectdojo.yml logs initializer | findstr /i password
#
# Стоп до импорта scanner: после логина в UI — ждём решения, код импорта не пишем.

services:
  defectdojo-nginx:
    image: defectdojo/defectdojo-nginx:${DD_NGINX_VERSION:-latest}
    container_name: defectdojo-nginx
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "-s", "-o", "/dev/null", "http://localhost:8080/login"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      defectdojo-uwsgi:
        condition: service_started
    environment:
      NGINX_METRICS_ENABLED: "false"
      DD_UWSGI_HOST: defectdojo-uwsgi
      DD_UWSGI_PORT: "3031"
    volumes:
      - defectdojo_media:/usr/share/nginx/html/media
    ports:
      - "${DD_PORT:-8081}:8080"
    networks:
      - pk-net

  defectdojo-uwsgi:
    image: defectdojo/defectdojo-django:${DD_DJANGO_VERSION:-latest}
    container_name: defectdojo-uwsgi
    restart: unless-stopped
    depends_on:
      defectdojo-initializer:
        condition: service_completed_successfully
      defectdojo-postgres:
        condition: service_healthy
      defectdojo-valkey:
        condition: service_healthy
    entrypoint:
      [
        "/wait-for-it.sh",
        "defectdojo-postgres:5432",
        "-t",
        "60",
        "--",
        "/entrypoint-uwsgi.sh",
      ]
    environment: &dd-common
      DD_DEBUG: "False"
      DD_ALLOWED_HOSTS: "*"
      DD_DATABASE_URL: postgresql://defectdojo:defectdojo@defectdojo-postgres:5432/defectdojo
      DD_CELERY_BROKER_URL: redis://defectdojo-valkey:6379/0
      DD_SECRET_KEY: "pk-demo-only-change-me-not-for-bank"
      DD_CREDENTIAL_AES_256_KEY: "pk-demo-aes-key-change-me-32b!!"
      DD_DATABASE_READINESS_TIMEOUT: "60"
    volumes:
      - ./defectdojo/extra_settings:/app/docker/extra_settings:ro
      - defectdojo_media:/app/media
    networks:
      - pk-net

  defectdojo-celeryworker:
    image: defectdojo/defectdojo-django:${DD_DJANGO_VERSION:-latest}
    container_name: defectdojo-celeryworker
    restart: unless-stopped
    depends_on:
      defectdojo-initializer:
        condition: service_completed_successfully
      defectdojo-postgres:
        condition: service_healthy
      defectdojo-valkey:
        condition: service_healthy
    entrypoint:
      [
        "/wait-for-it.sh",
        "defectdojo-postgres:5432",
        "-t",
        "60",
        "--",
        "/entrypoint-celery-worker.sh",
      ]
    environment:
      <<: *dd-common
    volumes:
      - ./defectdojo/extra_settings:/app/docker/extra_settings:ro
      - defectdojo_media:/app/media
    networks:
      - pk-net

  defectdojo-celerybeat:
    image: defectdojo/defectdojo-django:${DD_DJANGO_VERSION:-latest}
    container_name: defectdojo-celerybeat
    restart: unless-stopped
    depends_on:
      defectdojo-initializer:
        condition: service_completed_successfully
      defectdojo-postgres:
        condition: service_healthy
      defectdojo-valkey:
        condition: service_healthy
    entrypoint:
      [
        "/wait-for-it.sh",
        "defectdojo-postgres:5432",
        "-t",
        "60",
        "--",
        "/entrypoint-celery-beat.sh",
      ]
    environment:
      <<: *dd-common
    volumes:
      - ./defectdojo/extra_settings:/app/docker/extra_settings:ro
    networks:
      - pk-net

  defectdojo-initializer:
    image: defectdojo/defectdojo-django:${DD_DJANGO_VERSION:-latest}
    container_name: defectdojo-initializer
    depends_on:
      defectdojo-postgres:
        condition: service_healthy
    entrypoint:
      [
        "/wait-for-it.sh",
        "defectdojo-postgres:5432",
        "-t",
        "60",
        "--",
        "/entrypoint-initializer.sh",
      ]
    environment:
      DD_DATABASE_URL: postgresql://defectdojo:defectdojo@defectdojo-postgres:5432/defectdojo
      DD_ADMIN_USER: admin
      DD_ADMIN_PASSWORD: "${DD_ADMIN_PASSWORD:-admin}"
      DD_ADMIN_MAIL: admin@pk.local
      DD_ADMIN_FIRST_NAME: Admin
      DD_ADMIN_LAST_NAME: PK
      DD_INITIALIZE: "true"
      DD_SECRET_KEY: "pk-demo-only-change-me-not-for-bank"
      DD_CREDENTIAL_AES_256_KEY: "pk-demo-aes-key-change-me-32b!!"
      DD_DATABASE_READINESS_TIMEOUT: "60"
    volumes:
      - ./defectdojo/extra_settings:/app/docker/extra_settings:ro
    networks:
      - pk-net

  defectdojo-postgres:
    image: postgres:16-alpine
    container_name: defectdojo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: defectdojo
      POSTGRES_USER: defectdojo
      POSTGRES_PASSWORD: defectdojo
    volumes:
      - defectdojo_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U defectdojo -d defectdojo"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - pk-net

  defectdojo-valkey:
    image: valkey/valkey:8-alpine
    container_name: defectdojo-valkey
    restart: unless-stopped
    volumes:
      - defectdojo_redis:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - pk-net

volumes:
  defectdojo_postgres:
  defectdojo_media:
  defectdojo_redis:

networks:
  pk-net:
    external: true
