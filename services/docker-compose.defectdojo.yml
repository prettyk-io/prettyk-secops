# Демо DefectDojo для локального показа (готовые образы Docker Hub).
# НЕ для банка «как есть». Роутинг ZAP-отчётов сюда — отдельно, вместе.
#
# Порт UI: 8081 (8080 занят ZAP).
# Сеть: kdt-net (как остальные сервисы KDT).
#
#   docker network create kdt-net 2>nul
#   docker compose -f services/docker-compose.defectdojo.yml up -d
#   docker compose -f services/docker-compose.defectdojo.yml logs initializer | findstr /i password
#
# Стоп до импорта ZAP: после логина в UI — ждём решения, код импорта не пишем.

services:
  defectdojo-nginx:
    image: defectdojo/defectdojo-nginx:${DD_NGINX_VERSION:-latest}
    container_name: defectdojo-nginx
    depends_on:
      defectdojo-uwsgi:
        condition: service_started
    environment:
      NGINX_METRICS_ENABLED: "false"
      DD_UWSGI_HOST: defectdojo-uwsgi
      DD_UWSGI_PORT: "3031"
    volumes:
      - defectdojo_media:/usr/share/nginx/html/media
    ports:
      - "${DD_PORT:-8081}:8080"
    networks:
      - kdt-net

  defectdojo-uwsgi:
    image: defectdojo/defectdojo-django:${DD_DJANGO_VERSION:-latest}
    container_name: defectdojo-uwsgi
    depends_on:
      defectdojo-initializer:
        condition: service_completed_successfully
      defectdojo-postgres:
        condition: service_started
      defectdojo-valkey:
        condition: service_started
    entrypoint:
      [
        "/wait-for-it.sh",
        "defectdojo-postgres:5432",
        "-t",
        "60",
        "--",
        "/entrypoint-uwsgi.sh",
      ]
    environment: &dd-common
      DD_DEBUG: "False"
      DD_ALLOWED_HOSTS: "*"
      DD_DATABASE_URL: postgresql://defectdojo:defectdojo@defectdojo-postgres:5432/defectdojo
      DD_CELERY_BROKER_URL: redis://defectdojo-valkey:6379/0
      DD_SECRET_KEY: "kdt-demo-only-change-me-not-for-bank"
      DD_CREDENTIAL_AES_256_KEY: "kdt-demo-aes-key-change-me-32b!!"
      DD_DATABASE_READINESS_TIMEOUT: "60"
    volumes:
      - ./defectdojo/extra_settings:/app/docker/extra_settings:ro
      - defectdojo_media:/app/media
    networks:
      - kdt-net

  defectdojo-celeryworker:
    image: defectdojo/defectdojo-django:${DD_DJANGO_VERSION:-latest}
    container_name: defectdojo-celeryworker
    depends_on:
      defectdojo-initializer:
        condition: service_completed_successfully
      defectdojo-postgres:
        condition: service_started
      defectdojo-valkey:
        condition: service_started
    entrypoint:
      [
        "/wait-for-it.sh",
        "defectdojo-postgres:5432",
        "-t",
        "60",
        "--",
        "/entrypoint-celery-worker.sh",
      ]
    environment:
      <<: *dd-common
    volumes:
      - ./defectdojo/extra_settings:/app/docker/extra_settings:ro
      - defectdojo_media:/app/media
    networks:
      - kdt-net

  defectdojo-celerybeat:
    image: defectdojo/defectdojo-django:${DD_DJANGO_VERSION:-latest}
    container_name: defectdojo-celerybeat
    depends_on:
      defectdojo-initializer:
        condition: service_completed_successfully
      defectdojo-postgres:
        condition: service_started
      defectdojo-valkey:
        condition: service_started
    entrypoint:
      [
        "/wait-for-it.sh",
        "defectdojo-postgres:5432",
        "-t",
        "60",
        "--",
        "/entrypoint-celery-beat.sh",
      ]
    environment:
      <<: *dd-common
    volumes:
      - ./defectdojo/extra_settings:/app/docker/extra_settings:ro
    networks:
      - kdt-net

  defectdojo-initializer:
    image: defectdojo/defectdojo-django:${DD_DJANGO_VERSION:-latest}
    container_name: defectdojo-initializer
    depends_on:
      defectdojo-postgres:
        condition: service_started
    entrypoint:
      [
        "/wait-for-it.sh",
        "defectdojo-postgres:5432",
        "-t",
        "60",
        "--",
        "/entrypoint-initializer.sh",
      ]
    environment:
      DD_DATABASE_URL: postgresql://defectdojo:defectdojo@defectdojo-postgres:5432/defectdojo
      DD_ADMIN_USER: admin
      DD_ADMIN_PASSWORD: "${DD_ADMIN_PASSWORD:-admin}"
      DD_ADMIN_MAIL: admin@kdt.local
      DD_ADMIN_FIRST_NAME: Admin
      DD_ADMIN_LAST_NAME: KDT
      DD_INITIALIZE: "true"
      DD_SECRET_KEY: "kdt-demo-only-change-me-not-for-bank"
      DD_CREDENTIAL_AES_256_KEY: "kdt-demo-aes-key-change-me-32b!!"
      DD_DATABASE_READINESS_TIMEOUT: "60"
    volumes:
      - ./defectdojo/extra_settings:/app/docker/extra_settings:ro
    networks:
      - kdt-net

  defectdojo-postgres:
    image: postgres:16-alpine
    container_name: defectdojo-postgres
    environment:
      POSTGRES_DB: defectdojo
      POSTGRES_USER: defectdojo
      POSTGRES_PASSWORD: defectdojo
    volumes:
      - defectdojo_postgres:/var/lib/postgresql/data
    networks:
      - kdt-net

  defectdojo-valkey:
    image: valkey/valkey:8-alpine
    container_name: defectdojo-valkey
    volumes:
      - defectdojo_redis:/data
    networks:
      - kdt-net

volumes:
  defectdojo_postgres:
  defectdojo_media:
  defectdojo_redis:

networks:
  kdt-net:
    external: true
