# Industrial ZAP (G-37): API key + узкий api.addrs.
# Lab default остаётся services/docker-compose.zap.yml (disablekey).
#
#   set ZAP_API_KEY=...          # обязательно
#   set ZAP_API_ADDRS=127.0.0.1  # опционально; default loopback
#   docker compose -f services/docker-compose.zap.industrial.yml up -d
#
# Оркестратор: KDT_ZAP_API_KEY или ZAP_API_KEY (передаётся в ZapAdapter).

services:
  zap:
    image: zaproxy/zap-stable:2.17.0
    container_name: zap
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8099:8099"
    volumes:
      - ../zap/plugins:/zap/plugins:ro
    networks:
      - kdt-net
    environment:
      ZAP_API_KEY: ${ZAP_API_KEY:?set ZAP_API_KEY for industrial profile}
    command:
      - zap.sh
      - -daemon
      - -port
      - "8080"
      - -host
      - "0.0.0.0"
      - -config
      - api.disablekey=false
      - -config
      - api.key=${ZAP_API_KEY}
      - -config
      - api.addrs.addr.name=${ZAP_API_ADDRS:-127.0.0.1}
      - -config
      - api.addrs.addr.regex=false
      - -config
      - checkForUpdates=false
      - -config
      - updateAddons=false
      - -config
      - checkforupdates.dayLastChecked=never
      - -config
      - checkforupdates.reportRelease=false
      - -config
      - telemetry.reportError=false
      - -config
      - telemetry.reportUsage=false
      - -config
      - telemetry.allowTelemetry=false
    healthcheck:
      # С api.key версия без ключа отвечает 403 — передаём ZAP_API_KEY.
      test:
        [
          "CMD-SHELL",
          'curl -fsS "http://localhost:8080/JSON/core/view/version/?apikey=$${ZAP_API_KEY}"',
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 40s

networks:
  kdt-net:
    external: true
    name: kdt-net
