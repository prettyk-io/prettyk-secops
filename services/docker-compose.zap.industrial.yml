# Industrial scanner (G-37): API key + узкий api.addrs.
# Lab default остаётся services/docker-compose.scanner.yml (disablekey).
#
#   set SCANNER_API_KEY=...          # обязательно
#   set scanner_API_ADDRS=127.0.0.1  # опционально; default loopback
#   docker compose -f services/docker-compose.scanner.industrial.yml up -d
#
# Оркестратор: PK_SCANNER_API_KEY или SCANNER_API_KEY (передаётся в scannerAdapter).

services:
  scanner:
    image: zaproxy/scanner-stable:2.17.0
    container_name: scanner
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8099:8099"
    volumes:
      - ../scanner/plugins:/scanner/plugins:ro
    networks:
      - pk-net
    environment:
      SCANNER_API_KEY: ${SCANNER_API_KEY:?set SCANNER_API_KEY for industrial profile}
    command:
      - scanner.sh
      - -daemon
      - -port
      - "8080"
      - -host
      - "0.0.0.0"
      - -config
      - api.disablekey=false
      - -config
      - api.key=${SCANNER_API_KEY}
      - -config
      - api.addrs.addr.name=${scanner_API_ADDRS:-127.0.0.1}
      - -config
      - api.addrs.addr.regex=false
      - -config
      - checkForUpdates=false
      - -config
      - updateAddons=false
      - -config
      - checkforupdates.dayLastChecked=never
      - -config
      - checkforupdates.reportRelease=false
      - -config
      - telemetry.reportError=false
      - -config
      - telemetry.reportUsage=false
      - -config
      - telemetry.allowTelemetry=false
    healthcheck:
      # С api.key версия без ключа отвечает 403 — передаём SCANNER_API_KEY.
      test:
        [
          "CMD-SHELL",
          'curl -fsS "http://localhost:8080/JSON/core/view/version/?apikey=$${SCANNER_API_KEY}"',
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 40s

networks:
  pk-net:
    external: true
    name: pk-net
