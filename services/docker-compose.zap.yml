# Локальный scanner в Docker (переходный вариант, пока нет нативного scanner.bat / scanner.sh).
# В CI пайпе scanner поднимается бинарником отдельно — этот файл там не используется.
#
#   docker compose -f services/docker-compose.scanner.yml up -d
#
# Плагины: ../scanner/plugins → /scanner/plugins
# Порты:
#   8080 — main (для zapv2 / оркестратора)
#   8099 — публикуем под browser Local Server (оркестратор поднимает через addLocalServer)

services:
  scanner:
    image: zaproxy/scanner-stable:2.17.0
    container_name: scanner
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8099:8099"
    volumes:
      - ../scanner/plugins:/scanner/plugins:ro
      # IMP-HAR: host reports/runs → scanner importHar (harFile path rewrite in scanner_adapter)
      - ../reports/runs:/scanner/wrk/pk-runs
    networks:
      - pk-net
    # Main слушатель — как в официальном docker guide (-port 8080).
    # Browser proxy (8099) поднимает оркестратор: network.addLocalServer.
    # https://www.zaproxy.org/docs/docker/about/
    # https://www.zaproxy.org/docs/desktop/addons/network/options/localservers/
    command:
      - scanner.sh
      - -daemon
      - -port
      - "8080"
      - -host
      - "0.0.0.0"
      - -config
      - api.disablekey=true
      - -config
      - api.addrs.addr.name=.*
      - -config
      - api.addrs.addr.regex=true
      - -config
      - checkForUpdates=false
      - -config
      - updateAddons=false
      - -config
      - checkforupdates.dayLastChecked=never
      - -config
      - checkforupdates.reportRelease=false
      - -config
      - telemetry.reportError=false
      - -config
      - telemetry.reportUsage=false
      - -config
      - telemetry.allowTelemetry=false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/JSON/core/view/version/"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 40s

networks:
  pk-net:
    external: true
    name: pk-net
