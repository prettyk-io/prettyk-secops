# Сессионный шаблон PrettyK — изолированный runtime одной сессии.
#
# Предназначен для динамического развёртывания ComposeProvider'ом:
#   docker compose -f services/session-template.yml -p pk-session-<id> up -d
#
# Каждая сессия получает:
#   - собственный bridge-сеть (pk-net-<session_id>, создаётся провайдером);
#   - scanner daemon (scanner) на внутреннем DNS scanner:8080;
#   - authoring-браузер (Playwright + Xvfb + noVNC) с CDP :9222 и relay :9223;
#   - тестовую цель Juice Shop на internal DNS juice-shop:3000;
#   - demo API-lab (REST/GraphQL/gRPC) на internal DNS pk-api-lab:8090.
#
# Инварианты:
#   - НЕТ фиксированных container_name.
#   - НЕТ жёстких host-портов — все порты только expose/внутренние.
#   - Внешняя сеть задаётся при старте через COMPOSE_PROJECT_NAME/pk-net-<id>.
#   - После release сессии все ресурсы удаляются без зомби.

services:
  # Scanner daemon (OWASP scanner) — изолированный инстанс на сессию.
  scanner:
    image: zaproxy/scanner-stable:2.17.0
    # container_name — managed by ComposeProvider (no fixed name)
    restart: unless-stopped
    expose:
      - "8080"
      - "8099"
    volumes:
      - ../scanner/plugins:/scanner/plugins:ro
      - ../reports/runs:/scanner/wrk/pk-runs
    labels:
      - com.prettyk.component=scanner
      - com.prettyk.session-id=${PK_SESSION_ID:-unknown}
      - com.prettyk.generation=${PK_SESSION_GENERATION:-1}
    command:
      - scanner.sh
      - -daemon
      - -port
      - "8080"
      - -host
      - "0.0.0.0"
      - -config
      - api.disablekey=true
      - -config
      - api.addrs.addr.name=.*
      - -config
      - api.addrs.addr.regex=true
      - -config
      - checkForUpdates=false
      - -config
      - updateAddons=false
      - -config
      - checkforupdates.dayLastChecked=never
      - -config
      - checkforupdates.reportRelease=false
      - -config
      - telemetry.reportError=false
      - -config
      - telemetry.reportUsage=false
      - -config
      - telemetry.allowTelemetry=false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/JSON/core/view/version/"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 40s

  # Authoring Browser (Playwright + Chromium + Xvfb + noVNC + CDP relay).
  playwright-authoring:
    build:
      context: ./playwright-authoring
    image: pk-playwright-authoring:local
    restart: unless-stopped
    shm_size: 2gb
    expose:
      - "7902"
      - "9223"
    labels:
      - com.prettyk.component=browser-authoring
      - com.prettyk.session-id=${PK_SESSION_ID:-unknown}
      - com.prettyk.generation=${PK_SESSION_GENERATION:-1}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9222/json/version || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Тестовая цель — OWASP Juice Shop.
  juice-shop:
    image: bkimminich/juice-shop:v20.1.1
    restart: unless-stopped
    expose:
      - "3000"
    labels:
      - com.prettyk.component=target
      - com.prettyk.session-id=${PK_SESSION_ID:-unknown}

  # Демо API-lab: REST + OpenAPI + GraphQL + gRPC.
  pk-api-lab:
    build:
      context: ./pk-api-lab
    image: pk-api-lab:local
    restart: unless-stopped
    expose:
      - "8090"
      - "50051"
    labels:
      - com.prettyk.component=api-lab
      - com.prettyk.session-id=${PK_SESSION_ID:-unknown}
    environment:
      - PK_API_LAB_HTTP_PORT=8090
      - PK_API_LAB_GRPC_PORT=50051
    volumes:
      - ./pk-api-lab/proto_pack:/proto_pack:ro