# Долгоживущие сервисы PK (данные / пульты).
# Эфемерные (scanner в пайпе) сюда не входят.
#
# Запуск из корня репозитория:
#   docker compose -f services/docker-compose.yml up -d
# Или из этой папки:
#   docker compose up -d
#
# Порты:
#   7902 — noVNC Chromium (Playwright authoring, headed под Xvfb)   ← PW-A1
#   5050 — prettyk-allure3 (Allure 3 Awesome: dark/ru/SecOps logo, канон)
#   5051 — [свободен] legacy allure-light-secops выпилен 2026-09-02
#   8766 — LLM server (llama.cpp Qwen3-1.7B Q5_K_M, CPU inference)
#   EXP-01: PK_AI_ASSISTANT_ENABLED=0 toggles AI off for baseline runs
#
# PW-C1 (cutover): Selenium Grid (selenium-hub/chrome/firefox/chrome-video)
# выпилен — единственный браузерный рантайм теперь Playwright (playwright-authoring).
# WebDriverAdapter остаётся импортируемым для parity-тестов, но Grid не поднимается.
#
# Тома артефактов — ../reports (совпадает с orchestrator/utils/paths.py).
# Docker socket хоста не монтируется (в отличие от бывшего Selenoid).

include:
  - docker-compose.defectdojo.yml
  - docker-compose.sonarqube.yml
  - docker-compose.target.yml
  - docker-compose.api-lab.yml

services:
  # PW-A1: Airgap Playwright container — headed Chromium под Xvfb + noVNC стрим.
  # Авторинг-браузер живёт в контейнере, на десктопе оператора — ноль окон.
  # CDP :9222 (внутренний) → browser_service подключается через connect_over_cdp.
  # После cutover (PW-C1) это единственный браузерный рантайм.
  playwright-authoring:
    build:
      context: ./playwright-authoring
    image: pk-playwright-authoring:local
    container_name: playwright-authoring
    restart: unless-stopped
    shm_size: 2gb
    ports:
      - "7902:7902"   # noVNC stream (live Chromium under Xvfb)
      - "9223:9223"   # CDP socat relay (0.0.0.0:9223 → 127.0.0.1:9222) для connect_over_cdp
    # HEALTH-2: контейнер жив = CDP принимает соединения (curl version endpoint)
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9222/json/version || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Allure 3 Awesome (dark + ru). Дефолт lab — канон :5050.
  prettyk-allure3:
    image: prettyk-allure3:local
    container_name: prettyk-allure3
    restart: unless-stopped
    ports:
      - "5050:5050"
    volumes:
      - ../reports/allure-results:/app/allure-results
      - ../reports/allure3-report:/app/default-reports
      - ../reports/live:/app/runs-index:ro
      - ./allure-brand:/app/brand:ro
    environment:
      - KEEP_HISTORY=1
      - ALLURE_RESULTS_DIR=/app/allure-results
      - ALLURE_REPORT_DIR=/app/default-reports
      - RUNS_INDEX_DIR=/app/runs-index
      - ALLURE_BIN=allure
      - ALLURE_CONFIG=/app/allurerc.mjs
      - ALLURE_LOGO=/app/brand/logo.svg
      - ALLURE_REPORT_NAME=Проверка PK
      - ALLURE_THEME=dark
      - ALLURE_LANG=ru
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5050/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: llama-server
    restart: unless-stopped
    # PK_AI_ASSISTANT_ENABLED=0 → skip LLM; set on host before compose up
    volumes:
      - ./llm-model/qwen3-1.7b-q5_k_m.gguf:/models/qwen3-1.7b-q5_k_m.gguf:ro
    command:
      - -m
      - /models/qwen3-1.7b-q5_k_m.gguf
      - --host
      - 0.0.0.0
      - --port
      - "8768"
      - -t
      - "4"
      - -c
      - "4096"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8768/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s

  llama-server-reasoning:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: llama-server-reasoning
    restart: unless-stopped
    volumes:
      - ./llm-model/Qwen3-4B-Instruct-2507.Q5_K_M.gguf:/models/qwen3-4b-instruct-2507-q5_k_m.gguf:ro
    command:
      - -m
      - /models/qwen3-4b-instruct-2507-q5_k_m.gguf
      - --host
      - 0.0.0.0
      - --port
      - "8769"
      - -t
      - "4"
      - -c
      - "4096"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8769/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 180s

  llm-server:
    build:
      context: ..
      dockerfile: services/llm-server.Dockerfile
    image: pk-llm-server:dev
    container_name: llm-server
    restart: unless-stopped
    depends_on:
      llama-server:
        condition: service_healthy
      llama-server-reasoning:
        condition: service_healthy
    environment:
      PK_AI_ASSISTANT_ENABLED: "${PK_AI_ASSISTANT_ENABLED:-1}"
      LLM_MODEL_PATH: /nonexistent
      LLAMA_HOST: llama-server
      LLAMA_PORT: "8768"
      LLAMA_REASONING_HOST: llama-server-reasoning
      LLAMA_REASONING_PORT: "8769"
      LLM_FAST_MODEL_NAME: Qwen3-1.7B
      LLM_REASONING_MODEL_NAME: Qwen3-4B-Instruct-2507
      LISTEN_PORT: "8766"
      LLAMA_THREADS: "4"
      LLAMA_CTX: "4096"
    ports:
      - "8766:8766"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8766/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  default:
    name: pk-net
    # Общая сеть с docker-compose.scanner.yml и browser nodes.
    # Создаётся один раз: docker network create pk-net
    external: true
