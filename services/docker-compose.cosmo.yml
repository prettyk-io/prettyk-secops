# COS-013: Cosmo 2.0 — Docker Compose (Gitea + Woodpecker + MinIO + Cosmo API)
# Pure Box режим: локальные образы, не тянуть из интернета.
#
# Порты:
#   3000 — Gitea (forge)
#   8000 — Woodpecker (CI)
#   9000 — MinIO (S3-совместимое хранилище артефактов)
#   8100 — Cosmo API (FastAPI)
#
# Запуск:
#   docker compose -f services/docker-compose.cosmo.yml up -d

services:
  gitea:
    image: gitea/gitea:1.22
    container_name: cosmo-gitea
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=postgres:5432
      - GITEA__database__NAME=cosmo_gitea
      - GITEA__database__USER=prettyk
      - GITEA__database__PASSWD=prettyk
    volumes:
      - cosmo_gitea:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/version"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  woodpecker:
    image: woodpeckerci/woodpecker-server:latest
    container_name: cosmo-woodpecker
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - WOODPECKER_OPEN=true
      - WOODPECKER_GITEA=true
      - WOODPECKER_GITEA_URL=http://gitea:3000
      - WOODPECKER_DATABASE_DRIVER=postgres
      - WOODPECKER_DATABASE_DATASOURCE=postgres://prettyk:prettyk@postgres:5432/cosmo_woodpecker?sslmode=disable
    volumes:
      - cosmo_woodpecker:/var/lib/woodpecker
    depends_on:
      gitea:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  minio:
    image: minio/minio:latest
    container_name: cosmo-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=prettyk
      - MINIO_ROOT_PASSWORD=prettyk-minio-dev
    volumes:
      - cosmo_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  cosmo-api:
    build:
      context: ..
      dockerfile: services/cosmo-api.Dockerfile
    image: pk-cosmo-api:local
    container_name: cosmo-api
    restart: unless-stopped
    ports:
      - "8100:8100"
    environment:
      - PK_DEPLOY_PROFILE=enterprise
      - PK_PG_DSN=postgresql://prettyk:prettyk@postgres:5432/cosmo
      - PK_VALKEY_HOST=valkey
      - PK_VALKEY_PORT=6379
      - PK_GITEA_URL=http://gitea:3000
      - PK_WOODPECKER_URL=http://woodpecker:8000
      - PK_MINIO_URL=http://minio:9000
    depends_on:
      gitea:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  cosmo_gitea:
  cosmo_woodpecker:
  cosmo_minio:

networks:
  default:
    name: pk-net
    external: true
