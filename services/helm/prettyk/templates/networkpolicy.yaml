{{- if .Values.networkPolicy.enabled }}
# Default-deny для межсессионного трафика.
# Сессия может общаться только с prettyk-system.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pk-session-isolate
  namespace: {{ .Values.systemNamespace }}
  labels:
    {{- include "prettyk.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/part-of: prettyk
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/part-of: prettyk
{{- end }}