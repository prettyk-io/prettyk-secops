# Демо API для банка: REST+OpenAPI + GraphQL + gRPC.
#
#   docker compose -f services/docker-compose.api-lab.yml up -d --build
#
# С хоста:
#   http://127.0.0.1:8090/health
#   http://127.0.0.1:8090/openapi.json
#   http://127.0.0.1:8090/graphql
#   gRPC 127.0.0.1:50051
#   proto pack: services/pk-api-lab/proto_pack
#
# В Docker-сети (scanner/браузер): http://pk-api-lab:8090

services:
  pk-api-lab:
    build:
      context: ./pk-api-lab
    image: pk-api-lab:local
    container_name: pk-api-lab
    restart: unless-stopped
    ports:
      - "8090:8090"
      - "50051:50051"
    environment:
      - PK_API_LAB_HTTP_PORT=8090
      - PK_API_LAB_GRPC_PORT=50051
    volumes:
      # host-readable proto pack for Studio / playground inventory
      - ./pk-api-lab/proto_pack:/proto_pack:ro
    networks:
      - pk-net

networks:
  pk-net:
    external: true
    name: pk-net
