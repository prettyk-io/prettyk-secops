# Демо API для банка: REST+OpenAPI + GraphQL + gRPC.
#
#   docker compose -f services/docker-compose.api-lab.yml up -d --build
#
# С хоста:
#   http://127.0.0.1:8090/health
#   http://127.0.0.1:8090/openapi.json
#   http://127.0.0.1:8090/graphql
#   gRPC 127.0.0.1:50051
#   proto pack: services/kdt-api-lab/proto_pack
#
# В Docker-сети (ZAP/браузер): http://kdt-api-lab:8090

services:
  kdt-api-lab:
    build:
      context: ./kdt-api-lab
    image: kdt-api-lab:local
    container_name: kdt-api-lab
    restart: unless-stopped
    ports:
      - "8090:8090"
      - "50051:50051"
    environment:
      - KDT_API_LAB_HTTP_PORT=8090
      - KDT_API_LAB_GRPC_PORT=50051
    volumes:
      # host-readable proto pack for Studio / playground inventory
      - ./kdt-api-lab/proto_pack:/proto_pack:ro
    networks:
      - kdt-net

networks:
  kdt-net:
    external: true
    name: kdt-net
