<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Основной градиент шестерёнки: от оранжевато-красного сверху-справа к темно-бордовому снизу-слева -->
    <linearGradient id="gearGradient" x1="80%" y1="10%" x2="20%" y2="90%">
      <stop offset="0%" stop-color="#ff3823" />
      <stop offset="45%" stop-color="#e61212" />
      <stop offset="85%" stop-color="#b80808" />
      <stop offset="100%" stop-color="#8a0000" />
    </linearGradient>

    <!-- Тень от крестика (Long shadow) -->
    <linearGradient id="longShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d0000" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#2b0000" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#180000" stop-opacity="0.0" />
    </linearGradient>

    <!-- Клиппинг по контуру шестерёнки для длинной тени -->
    <clipPath id="gearClip">
      <path d="
        M 86,18 L 114,18 C 117,18 119,20 120,23 L 123,34 A 62,62 0 0 0 138,40 L 148,31 C 150,29 154,29 156,31 L 176,51 C 178,53 178,57 176,59 L 167,69 A 62,62 0 0 1 173,84 L 184,87 C 187,88 189,90 189,93 L 189,121 C 189,124 187,126 184,127 L 173,130 A 62,62 0 0 1 167,145 L 176,155 C 178,157 178,161 176,163 L 156,183 C 154,185 150,185 148,183 L 138,174 A 62,62 0 0 1 123,180 L 120,191 C 119,194 117,196 114,196 L 86,196 C 83,196 81,194 80,191 L 77,180 A 62,62 0 0 1 62,174 L 52,183 C 50,185 46,185 44,183 L 24,163 C 22,161 22,157 24,155 L 33,145 A 62,62 0 0 1 27,130 L 16,127 C 13,126 11,124 11,121 L 11,93 C 11,90 13,88 16,87 L 27,84 A 62,62 0 0 1 33,69 L 24,59 C 22,57 22,53 24,51 L 44,31 C 46,29 50,29 52,31 L 62,40 A 62,62 0 0 1 77,34 L 80,23 C 81,20 83,18 86,18 Z
      " />
    </clipPath>
  </defs>

  <!-- Тело шестерёнки -->
  <path fill="url(#gearGradient)" d="
    M 86,18 L 114,18 C 117,18 119,20 120,23 L 123,34 A 62,62 0 0 0 138,40 L 148,31 C 150,29 154,29 156,31 L 176,51 C 178,53 178,57 176,59 L 167,69 A 62,62 0 0 1 173,84 L 184,87 C 187,88 189,90 189,93 L 189,121 C 189,124 187,126 184,127 L 173,130 A 62,62 0 0 1 167,145 L 176,155 C 178,157 178,161 176,163 L 156,183 C 154,185 150,185 148,183 L 138,174 A 62,62 0 0 1 123,180 L 120,191 C 119,194 117,196 114,196 L 86,196 C 83,196 81,194 80,191 L 77,180 A 62,62 0 0 1 62,174 L 52,183 C 50,185 46,185 44,183 L 24,163 C 22,161 22,157 24,155 L 33,145 A 62,62 0 0 1 27,130 L 16,127 C 13,126 11,124 11,121 L 11,93 C 11,90 13,88 16,87 L 27,84 A 62,62 0 0 1 33,69 L 24,59 C 22,57 22,53 24,51 L 44,31 C 46,29 50,29 52,31 L 62,40 A 62,62 0 0 1 77,34 L 80,23 C 81,20 83,18 86,18 Z
  " />

  <!-- Длинная плоская тень (Long shadow) под углом 45 градусов -->
  <g clip-path="url(#gearClip)">
    <polygon fill="url(#longShadow)" points="
      83,75
      107,99
      210,202
      176,236
      73,133
      100,160
      210,270
      150,300
    " />
    <polygon fill="url(#longShadow)" points="
      124,75
      107,99
      220,212
      250,182
      127,117
      100,160
      230,290
      270,250
    " />
  </g>

  <!-- Белый закруглённый крест X -->
  <path fill="#ffffff" d="
    M 79,65 C 75,61 69,61 65,65 C 61,69 61,75 65,79 L 86,107 L 65,135 C 61,139 61,145 65,149 C 69,153 75,153 79,149 L 107,121 L 135,149 C 139,153 145,153 149,149 C 153,145 153,139 149,135 L 121,107 L 149,79 C 153,75 153,69 149,65 C 145,61 139,61 135,65 L 107,93 Z
  " />
</svg>
